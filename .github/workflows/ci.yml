# Controlli automatici a ogni push e pull request.
# Se un test di sicurezza fallisce o una dipendenza ha vulnerabilità note, il controllo diventa rosso.
name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1' # ogni lunedì: ricontrolla le dipendenze anche se il codice non cambia

permissions:
  contents: read # il workflow può solo leggere il codice, non modificarlo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # `npm ci` installa ESATTAMENTE le versioni del package-lock.json (niente sorprese).
      - run: npm ci
      # Librerie che arrivano nel browser di chi visita il sito: nessuna vulnerabilità nota, nemmeno moderata.
      - run: npm audit --omit=dev --audit-level=moderate
      # Strumenti usati solo per costruire il sito (sul nostro computer o qui): blocca i problemi gravi.
      # Quelli lievi e moderati li sistema Dependabot appena esce la correzione.
      - run: npm audit --audit-level=high
      # Typecheck + test (inclusi quelli di sicurezza) + build.
      - run: npm run build
